<title>Prototipo Catmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Paleta azul de Marco con estilo iOS + Airbnb: superficies claras, barras translúcidas, listas agrupadas, selección azul. Solo tema claro. */
:root{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:#eef1f7; --fill:#e6e8f0; --hairline:#e6e8f0; --border-strong:#cfd4e0;
  --text:#003c70; --text-2:#626a80; --text-3:#aab0c0;
  --accent:#0d76ff; --accent-strong:#0a6cf0; --accent-text:#0a5fd1; --accent-soft:#e7effb;
  --primary:var(--accent-strong); --on-primary:#ffffff;
  --success:#2fb47c; --success-bg:#eafaf3; --amber:#f5a623; --amber-soft:#fff8ee; --orange:#ff6600; --orange-soft:#fff2ea;
  --danger:#e5484d; --danger-text:#c93b40; --danger-bg:#fdf1ef; --info:var(--accent); --warning:var(--orange);
  --chip:#f2f1f7; --disabled:#cccccc;
  --stage:#e3e7ef; --overlay:#00000026; --glass:rgba(255,255,255,.76);
  --r-md:16px; --r-lg:24px; --r-btn:14px; --pill:999px;
  --font:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,60,112,.04),0 4px 14px rgba(0,60,112,.06);
  --shadow-float:0 10px 28px #0d76ff20;
  --nav-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.tnum{font-variant-numeric:tabular-nums}

/* Escenario */
.stage{min-height:100%;display:grid;grid-template-columns:340px auto;gap:40px;justify-content:center;align-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;border:10px solid #10151f;border-radius:54px;overflow:hidden;background:var(--bg);box-shadow:0 30px 60px rgba(0,60,112,.18)}
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (max-width:999px){
  body{background:var(--bg)}
  .stage{display:block;padding:0;height:100%;min-height:0}
  .panel{display:none!important}
  .device{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
}

/* Panel de pruebas */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:20px;max-height:calc(100vh - 48px);overflow:auto;box-shadow:var(--shadow)}
.panel h2{margin:0;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);font-weight:700}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:40px;height:auto;flex:none}
.brand b{font-size:22px;font-weight:800;letter-spacing:-.02em}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--pill);background:var(--surface-2);color:var(--text-2)}
.panel p{margin:0;color:var(--text-2);font-size:14px}
.pgroup{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:38px;padding:0 14px;border-radius:var(--pill);background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);box-shadow:inset 0 0 0 2px var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center}
.swatch[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.swatch svg{width:30px;height:auto}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.switch{width:51px;height:31px;border-radius:var(--pill);background:var(--fill);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.task{border:1px solid var(--hairline);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.task-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.task-n{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px}
.task.done .task-n{background:var(--success);color:#fff}
.task.running{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.task p{color:var(--text);font-size:14px}
.task-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-2)}
.linkbtn{font-weight:600;font-size:14px;color:var(--accent-text)}

/* Pantalla */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:14px;padding-bottom:calc(var(--nav-h) + 76px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.screen > *{flex-shrink:0}
.screen.public{padding:0 0 110px;gap:0;background:var(--surface)}
.screen.public.done{background:var(--bg)}
.screen.public.chatmode{padding-bottom:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .lt{min-width:0}
.eyebrow{margin:0;font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
h1.title{margin:2px 0 0;font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--text-2);font-size:14px;margin:4px 0 0}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.dot.off{background:var(--accent)}
.offline-bar{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-text);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
.offline-bar svg{flex:none;margin-top:1px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-strong);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.avatar.lg{width:72px;height:72px;font-size:24px}
.avatar.soft{background:var(--surface-2);color:var(--text)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;box-shadow:var(--shadow);flex:none;color:var(--accent-text)}

/* Botones */
.btn{min-height:50px;padding:0 18px;border-radius:var(--r-btn);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;white-space:nowrap;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary,.btn-accent{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px #0d76ff30}
.btn-light,.btn-ghost{background:var(--accent-soft);color:var(--accent-text)}
.btn-line{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border-strong)}
.btn-block{width:100%}
.btn[disabled]{background:var(--disabled);color:#fff;box-shadow:none;cursor:not-allowed}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}

/* Resumen de hoy */
.summary-card{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.summary-card .k{font-size:15px;font-weight:600;color:var(--text-2)}
.summary-card .big{font-size:42px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:2px}
.progress{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--text-2)}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Listas agrupadas */
.section{display:flex;flex-direction:column;gap:8px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px}
.section-h h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.section-h button{font-size:15px;font-weight:600;color:var(--accent-text)}
.card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;min-height:60px}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:16px;height:1px;background:var(--hairline)}
.inset-ico .row + .row::before{left:60px}
.inset-avatar .row + .row::before{left:72px}
.inset-time .row + .row::before{left:84px}
button.row:active{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .t1{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{display:block;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--text-3);display:grid;flex:none}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;background:var(--c,var(--accent));flex:none}
.time{width:56px;flex:none;font-weight:700;font-size:15px;line-height:1.15}
.time small{display:block;font-weight:500;color:var(--text-2);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--pill);font-size:12px;font-weight:600;white-space:nowrap;flex:none;color:var(--text);background:var(--chip)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--text-3));flex:none}
.chip:has(svg)::before{display:none}
.chip.ok{background:var(--success-bg);--dot:var(--success)}
.chip.warn{background:var(--amber-soft);--dot:var(--amber)}
.chip.due{background:var(--orange-soft);--dot:var(--orange)}
.chip.bad{background:var(--danger-bg);--dot:var(--danger)}
.chip.info{background:var(--accent-soft);--dot:var(--accent)}
.chip.neutral{background:var(--chip);color:var(--text-2)}
.chip.recent{background:var(--accent-soft);color:var(--accent-text);--dot:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.empty{padding:28px 16px;text-align:center;color:var(--text-2);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* Barra de navegación flotante y translúcida */
.nav{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));height:var(--nav-h);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:var(--pill);display:grid;grid-template-columns:1fr 1fr 60px 1fr 1fr;align-items:center;padding:6px;gap:2px;z-index:10;box-shadow:0 10px 30px rgba(0,60,112,.10),inset 0 0 0 1px rgba(0,60,112,.06)}
.nav .tab{height:52px;min-width:0;border-radius:var(--pill);color:var(--text-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600}
.nav .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Agenda */
.week-card{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);padding:8px 6px}
.week{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}

.day.today b{color:var(--accent-text)}
.day[aria-pressed="true"] b{background:var(--accent-strong);color:#fff}
.day i{width:5px;height:5px;border-radius:50%;background:var(--text-3);display:block}
.slots{display:flex;flex-direction:column}
.hour{display:grid;grid-template-columns:54px 1fr;gap:10px;min-height:56px;padding-block:4px}
.hour > span{font-size:12px;color:var(--text-2);font-weight:600;padding-top:6px}
.hour .cell{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--hairline);padding-top:6px}
.free{min-height:40px;border-radius:12px;color:var(--text-2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;padding:0 12px;text-align:left}

.appt{position:relative;overflow:hidden;background:var(--accent-soft);border-radius:12px;padding:10px 12px 10px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}

.appt .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.appt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt span{font-size:13px;color:var(--text-2)}
.appt .chip{background:var(--surface)}
.appt.done{background:var(--surface-2)}
.appt.done::before{background:var(--text-3)}

/* Pacientes y clientes */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--hairline);border-radius:12px;padding:0 12px;height:44px;color:var(--text-2)}

.search input::placeholder{color:var(--text-2)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 3px var(--accent-soft)}
.client-head{background:var(--surface);border-radius:var(--r-lg);padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;box-shadow:var(--shadow)}
.client-head h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.quick button{background:var(--surface-2);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;line-height:1.15;color:var(--accent-text);min-width:0}
.tabs{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;min-height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text)}

.entry{background:var(--surface);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);text-align:left;width:100%}
.entry-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.entry-h b{font-size:16px}
.entry-h small{color:var(--text-2);font-size:13px}
.entry dl{margin:0;display:flex;flex-direction:column;gap:10px}
.entry dt{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
.entry dd{margin:2px 0 0;font-size:15px}
.entry .preview{color:var(--text-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry.latest{box-shadow:var(--shadow),inset 0 0 0 2px var(--accent)}
.plan{padding:16px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:var(--pill);background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--text-2)}
.kv b{color:var(--text)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:1;border-radius:14px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 10px,var(--fill) 10px 20px);display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:600;color:var(--text-2);max-width:100%}

/* Cobrar */
.client-chip{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);font-size:15px;font-weight:600;width:100%;text-align:left;min-height:50px}
.client-chip .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client-chip .x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:var(--surface);border-radius:var(--r-md);padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;text-align:left;box-shadow:var(--shadow);position:relative}
.item b{font-size:15px;font-weight:600;line-height:1.25}
.item span{font-size:17px;font-weight:700}

.item .q{position:absolute;top:10px;right:10px;min-width:24px;height:24px;border-radius:var(--pill);background:var(--accent-strong);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 6px}

.item.free-item{background:transparent;box-shadow:none;border:1.5px dashed var(--text-3);color:var(--text-2)}
.cartbar{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + var(--nav-h) + 52px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-radius:22px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-float),inset 0 0 0 1px rgba(0,60,112,.06);z-index:9}
.cartbar .grow{flex:1;min-width:0}
.cartbar small{display:block;color:var(--text-2);font-size:13px}
.cartbar b{font-size:20px;font-weight:800}

/* Hojas */
.overlay{position:absolute;inset:0;background:var(--overlay);z-index:30;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:28px 28px 0 0;z-index:31;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,60,112,.10)}
.sheet.in{animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:5px;border-radius:var(--pill);background:var(--border-strong);margin:8px auto 0;flex:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(20px,env(safe-area-inset-right,0px)) 8px max(20px,env(safe-area-inset-left,0px));flex:none}
.sheet-h h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.sheet-h .iconbtn{background:var(--surface-2);box-shadow:none;width:34px;height:34px;color:var(--text-2);-webkit-backdrop-filter:none;backdrop-filter:none}
.sheet-body{overflow-y:auto;padding:8px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.sheet-f{flex:none;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:8px}
.sheet-f .hint{font-size:13px;color:var(--text-2);text-align:center}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.label{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em}
.input{height:52px;border-radius:12px;border:1px solid var(--border-strong);padding:0 14px;font-size:17px;background:var(--surface);width:100%}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:vertical;line-height:1.4}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.err-msg{font-size:13px;color:var(--danger-text);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--surface);font-size:15px;font-weight:600;text-align:left;display:flex;flex-direction:column;justify-content:center}
.opt small{font-weight:500;color:var(--text-2);font-size:12px}
.opt[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.opt[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.times .opt{align-items:center;padding:8px 4px;font-size:14px}
.picked{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.picked .grow{flex:1;min-width:0}
.picked button{font-size:15px;font-weight:600;color:var(--accent-text)}
.results{display:flex;flex-direction:column;border:1px solid var(--hairline);border-radius:14px;overflow:hidden}
.results button{display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;min-height:52px}
.results button + button{border-top:1px solid var(--hairline)}
.summary{background:var(--surface-2);border-radius:14px;padding:14px 16px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.summary b{font-size:16px}
.done-box{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:12px 0 4px}
.done-box .badge{width:76px;height:76px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(47,180,124,.3)}
.done-box h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.done-box p{margin:0;color:var(--text-2);font-size:15px;max-width:30ch}
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite}
.paytotal{text-align:center;display:flex;flex-direction:column;gap:2px}
.paytotal small{color:var(--text-2);font-weight:600}
.paytotal b{font-size:40px;font-weight:800;letter-spacing:-.03em}
.paylines{display:flex;flex-direction:column;gap:10px}
.payline{border:1px solid var(--hairline);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.payline .r{display:flex;align-items:center;gap:10px}
.payline .r b{flex:1}
.money{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:12px;height:46px;padding:0 12px;gap:4px;background:var(--surface);width:130px}
.money span{color:var(--text-2);font-weight:600}
.money input{border:0;outline:0;width:100%;font-size:17px;font-weight:700;text-align:right;background:transparent}
.money:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.method{min-height:56px;border-radius:14px;background:var(--surface-2);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;font-size:15px}
.method svg{color:var(--accent)}
.paystate{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;padding:10px;border-radius:12px;color:var(--text)}
.paystate::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none}

.lines .row{min-height:52px;padding:10px 0}
.lines .row + .row::before{left:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.ticket{background:#fff;margin:0 auto;width:250px;max-width:100%;padding:18px 16px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.5;color:#111;border:1px solid var(--hairline);box-shadow:var(--shadow);border-radius:4px}

.page{background:#fff;border:1px solid var(--hairline);box-shadow:var(--shadow);border-radius:6px;padding:22px 20px;font-size:13px;display:flex;flex-direction:column;gap:12px;aspect-ratio:8.5/11;max-width:100%;overflow:hidden}

.menu-list{display:flex;flex-direction:column}

.proto{background:var(--surface-2);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:14px}

.cover,.confirm-photo{background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.3) 0 2px,transparent 3px) 0 0/18px 18px,linear-gradient(160deg,#e7effb 0%,#0d76ff 120%)}
.cover{height:230px;display:flex;align-items:flex-end;padding:16px 16px 40px}

.host{display:flex;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)}

.pub-body{padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.step-h{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}

.chat-in{display:flex;gap:8px;padding:10px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--hairline)}

.sim{font-size:12px;text-align:center;color:var(--text-2);padding:6px;background:var(--surface)}
.exit-proto{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(8px,env(safe-area-inset-right,0px));z-index:20;font-size:12px;font-weight:600;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--accent-text);border-radius:var(--pill);padding:7px 12px;box-shadow:0 2px 10px rgba(0,60,112,.12),inset 0 0 0 1px rgba(0,60,112,.06)}
@media (min-width:1000px){.exit-proto{display:none}}
@media (max-width:999px){.urlbar{padding-right:150px}.sim{text-align:left;padding-left:16px;padding-right:150px}}

/* Avisos */
.toast-root{position:absolute;left:16px;right:16px;bottom:calc(12px + var(--nav-h) + 128px);display:flex;justify-content:center;z-index:60;pointer-events:none}
.toast{pointer-events:auto;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--text);border-radius:16px;padding:12px 14px 12px 16px;display:flex;align-items:center;gap:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-float),inset 0 0 0 1px rgba(0,60,112,.06);animation:up .2s ease;max-width:100%}
.toast button{color:var(--accent-text);font-weight:700;padding:6px 8px;border-radius:8px}

/* Gato */
.cat-layer{position:absolute;inset:0;pointer-events:none;z-index:40}
.cat{position:absolute;left:0;width:48px;height:36px;pointer-events:auto;cursor:pointer;transition:bottom .15s ease}
.cat .spr{width:48px;height:36px;display:block;transform-origin:center}
.cat .spr svg{display:block;width:48px;height:36px;image-rendering:pixelated}
.cat.jump .spr{animation:jump .6s ease}
.zz{position:absolute;top:-14px;right:-4px;font-size:12px;font-weight:800;color:var(--text-2);animation:zz 2s ease-in-out infinite}
.cat-pop{position:absolute;width:250px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow-float),0 2px 8px rgba(0,60,112,.08);padding:8px;pointer-events:auto;animation:pop .18s ease;border:1px solid var(--hairline)}
.cat-pop .msg{padding:8px 10px;font-size:14px;line-height:1.4}
.cat-pop .msg b{display:block;margin-bottom:2px}
.cat-pop .acts{display:flex;gap:6px;padding:4px 6px 6px;flex-wrap:wrap}
.cat-pop .menu-list button{min-height:44px;padding:0 10px;border-radius:12px;font-size:14px}
.cat-pop .menu-list button + button{border-top:0}
.cat-pop .menu-list button:hover{background:var(--surface-2)}
.guide{position:absolute;inset:0;z-index:50}
.ring{position:absolute;border-radius:18px;box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(0,30,60,.42);pointer-events:none;animation:pulse 1.4s ease-in-out infinite}
.guide-tip{position:absolute;left:16px;right:16px;background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:10px;font-size:15px}
.guide-tip .r{display:flex;align-items:center;gap:10px}
.guide-tip .mini svg{width:32px;height:24px;flex:none}

@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:translateY(6px) scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jump{0%,100%{translate:0 0}40%{translate:0 -16px}70%{translate:0 0}85%{translate:0 -5px}}
@keyframes zz{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--accent),0 0 0 9999px rgba(0,30,60,.42)}50%{box-shadow:0 0 0 8px var(--accent),0 0 0 9999px rgba(0,30,60,.42)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function buildData() {
  const g = G();
  const items = [
    ...g.services.map((s, i) => ({ id: 's' + i, type: 'service', name: s[0], price: s[1], dur: s[2] })),
    ...g.products.map((p, i) => ({ id: 'p' + i, type: 'product', name: p[0], price: p[1] }))
  ];
  const clients = g.names.map((n, i) => ({ id: 'c' + i, name: n, phone: PHONES[i], age: [34, 41, 27, 52, 30, 45, 23][i] }));
  const records = {};
  clients.forEach((c, i) => {
    const src = g.records[i] || g.records._;
    records[c.id] = src.map((r, j) => ({ id: `r${i}_${j}`, ...r, author: g.pro }));
  });
  const s = i => 's' + Math.min(i, g.services.length - 1);
  const A = (c, sv, day, h, m, status, extra) => ({ id: uid('a'), clientId: 'c' + c, serviceId: s(sv), day, start: h * 60 + m, status, paid: false, ...extra });
  const appts = [
    A(1, g.t3service, 0, 9, 0, 'completed'),
    A(4, 1, 0, 10, 0, 'completed', { paid: true }),
    A(0, 0, 0, 12, 0, 'confirmed'),
    A(3, 2, 0, 13, 30, 'pending'),
    A(5, 0, 0, 16, 0, 'confirmed'),
    A(6, 1, 0, 18, 0, 'pending'),
    A(4, 0, 1, 10, 0, 'confirmed'),
    A(3, 1, 1, 13, 0, 'confirmed'),
    A(6, 0, 1, 18, 0, 'pending'),
    A(0, 1, 2, 9, 30, 'confirmed'),
    A(5, 2, 2, 11, 0, 'confirmed'),
    A(1, 0, 3, 12, 0, 'confirmed'),
    A(2, 1, 4, 10, 30, 'pending'),
    A(0, 0, -21, 11, 0, 'completed', { paid: true }),
    A(1, 0, -28, 12, 0, 'completed', { paid: true }),
    A(2, 1, -45, 16, 0, 'completed', { paid: true }),
    A(3, 0, -60, 10, 0, 'completed', { paid: true })
  ];
  const sales = appts.filter(a => a.paid).map(a => {
    const it = items.find(i => i.id === a.serviceId);
    return { id: uid('v'), clientId: a.clientId, day: a.day, apptId: a.id, lines: [{ name: it.name, price: it.price, qty: 1 }], total: it.price, payments: [{ method: a.day === 0 ? 'card' : 'cash', amount: it.price }] };
  });
  return { items, clients, records, appts, sales };
}

/* ---------- tareas ---------- */
function checkTasks() {
  const g = G(), d = S.data;
  const tc = 'c' + g.t1.client;
  const done = [
    d.appts.some(a => a.clientId === tc && a.day === 1 && a.start === 17 * 60 && a.status !== 'cancelled'),
    !!S.flags.t2,
    d.sales.some(v => v.clientId === 'c1' && v.isNew && v.payments.filter(p => p.amount > 0).length >= 2),
    !!S.flags.t4
  ];
  done.forEach((ok, i) => {
    const t = S.tasks[i];
    if (ok && !t.done) { t.done = true; t.elapsed = t.start ? Date.now() - t.start : null; }
  });
}

  const el = $('#screen');

  else if (S.stack.length) el.innerHTML = renderClient(S.stack.at(-1).id);
  else el.innerHTML = ({ hoy: renderHoy, agenda: renderAgenda, clientes: renderClientes, cobrar: renderCobrar })[S.tab]();
  el.dataset.key = key;
  if (prevKey === key) el.scrollTop = st; else el.scrollTop = 0;
  const app = $('#app');
  app.querySelectorAll('.fab,.cartbar,.pub-sticky,.exit-proto').forEach(n => n.remove());

function renderHoy() {
  const g = G(), d = S.data;
  const today = d.appts.filter(a => a.day === 0 && a.status !== 'cancelled').sort((a, b) => a.start - b.start);
  const cobrado = d.sales.filter(v => v.day === 0).reduce((a, v) => a + v.payments.filter(p => p.method !== 'due').reduce((x, p) => x + p.amount, 0), 0);
  const attended = today.filter(a => a.status === 'completed').length;
  const pct = today.length ? Math.round(attended / today.length * 100) : 0;
  const pend = d.appts.filter(a => a.day >= 0 && a.status === 'pending').length;
  const porCobrar = today.filter(a => a.status === 'completed' && !a.paid).length;
  const web = d.appts.filter(a => a.source === 'web' && !a.seen);
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Buenos días' : hour < 19 ? 'Buenas tardes' : 'Buenas noches';
  const rows = [];
  if (web.length) rows.push(`<button class="row" data-a="openAppt" data-id="${web[0].id}"><span class="ico" style="--c:var(--info)">${ic('globe', 18, 2)}</span><span class="grow"><span class="t1">Nueva cita reservada en línea</span><span class="t2">${esc(cli(web[0].clientId).name)} · ${fmtDay(web[0].day)} ${fmtTime(web[0].start)}</span></span>${chev()}</button>`);
  if (porCobrar) rows.push(`<button class="row" data-a="tab" data-v="cobrar"><span class="ico" style="--c:var(--warning)">${ic('cash', 18, 2)}</span><span class="grow"><span class="t1">${porCobrar} ${porCobrar === 1 ? 'cita atendida' : 'citas atendidas'} por cobrar</span><span class="t2">Toca para cobrar</span></span>${chev()}</button>`);
  if (pend) rows.push(`<button class="row" data-a="tab" data-v="agenda"><span class="ico" style="--c:var(--amber)">${ic('clock', 18, 2)}</span><span class="grow"><span class="t1">${pend} ${pend === 1 ? 'cita' : 'citas'} por confirmar</span><span class="t2">Revisa tu agenda</span></span>${chev()}</button>`);
  return `
  <header class="top">
    <div class="lt"><p class="eyebrow">${cap(fmtDay(0, true).replace('Hoy, ', ''))}</p><h1 class="title">${greet}, ${esc(g.first)}</h1><p class="sub">${esc(g.biz)} · ${syncHTML()}</p></div>

    <div><span class="k">Cobrado hoy</span><div class="big tnum">${money(cobrado)}</div></div>
    <div class="progress"><div class="bar"><i style="width:${pct}%;background:var(--accent)"></i></div><span>${attended} de ${today.length} ${today.length === 1 ? 'cita atendida' : 'citas atendidas'}</span></div>
    <div class="actions2">
      <button class="btn btn-primary" data-a="newAppt" data-guide="hoy">${ic('plus', 20, 2.2)}Nueva cita</button>

  <section class="section">
    <div class="section-h"><h2>Citas de hoy</h2><button data-a="tab" data-v="agenda">Ver agenda</button></div>
    ${today.length ? `<div class="list inset-time">${today.map(apptRow).join('')}</div>` : `<div class="card empty">No tienes citas hoy.</div>`}

}

/* ---------- Agenda ---------- */
function renderAgenda() {
  const d = S.data;
  const days = Array.from({ length: 14 }, (_, i) => i);
  const dd = dateOf(S.day);
  const list = d.appts.filter(a => a.day === S.day && a.status !== 'cancelled').sort((a, b) => a.start - b.start);
  let hours = '';
  for (let h = 9; h < 20; h++) {
    const inHour = list.filter(a => Math.floor(a.start / 60) === h);
    const busy = list.some(a => a.start < h * 60 && a.start + svc(a.serviceId).dur > h * 60);
    hours += `<div class="hour"><span class="tnum">${fmtTime(h * 60).replace(':00', '')}</span><div class="cell">${inHour.map(a => {
      const c = cli(a.clientId), sv = svc(a.serviceId);
      return `<button class="appt ${a.status === 'completed' ? 'done' : ''}" data-a="openAppt" data-id="${a.id}"><span class="r"><b>${esc(c.name)}</b>${statusChip(a)}</span><span>${fmtTime(a.start)} – ${fmtTime(a.start + sv.dur)} · ${esc(sv.name)}</span></button>`;
    }).join('')}${!inHour.length && !busy ? `<button class="free" data-a="newAppt" data-day="${S.day}" data-time="${h * 60}" aria-label="Agendar a las ${fmtTime(h * 60)}">${ic('plus', 16)}Libre</button>` : ''}</div></div>`;
  }
  return `
  <header class="top"><div class="lt"><p class="eyebrow">${cap(MO[dd.getMonth()])} ${dd.getFullYear()}</p><h1 class="title">Agenda</h1><p class="sub">${syncHTML()}</p></div><button class="iconbtn" data-a="newAppt" data-guide="agenda" aria-label="Nueva cita">${ic('plus', 22, 2.2)}</button></header>
  ${offlineBar()}
  <div class="week-card"><div class="week" role="group" aria-label="Elegir día">${days.map(i => {
    const x = dateOf(i); const has = d.appts.some(a => a.day === i && a.status !== 'cancelled');
    return `<button class="day${i === 0 ? ' today' : ''}" data-a="day" data-v="${i}" aria-pressed="${S.day === i}"><small>${i === 0 ? 'Hoy' : WDS[x.getDay()]}</small><b class="tnum">${x.getDate()}</b>${has ? '<i></i>' : '<i style="visibility:hidden"></i>'}</button>`;
  }).join('')}</div></div>
  <section class="section"><div class="section-h"><h2>${fmtDay(S.day, true)}</h2></div><div class="slots">${hours}</div></section>`;
}

  if (id === 'c0') S.flags.t2 = true;

  const tab = S.clientTab;
  const appts = d.appts.filter(a => a.clientId === id && a.status !== 'cancelled').sort((a, b) => b.day - a.day || b.start - a.start);
  const sales = d.sales.filter(v => v.clientId === id).sort((a, b) => b.day - a.day);
  let body = '';
  if (tab === 'record') {
    let extra = '';
    if (g.plan && g.plan.client === +id.slice(1)) {
      const p = g.plan; const pct = Math.round(p.paid / p.total * 100);
      extra += `<div class="card plan"><div class="entry-h"><b>Plan de tratamiento</b><span class="chip due">Saldo ${money(p.total - p.paid)}</span></div><span style="font-size:14px">${esc(p.name)}</span><div class="bar"><i style="width:${pct}%"></i></div><div class="kv"><span>Pagado <b class="tnum">${money(p.paid)}</b></span><span>Total <b class="tnum">${money(p.total)}</b></span></div></div>`;
    }
    if (g.weights && id === 'c0') extra += weightCard(g.weights);
    if (g.prefs && g.prefs.client === +id.slice(1)) {
      extra += `<div class="entry"><div class="entry-h"><b>Preferencias</b><small>Siempre visible</small></div><dl>${g.prefs.items.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><div class="photos">${g.prefs.photos.map(a => `<div class="photo">${fmtAgo(a)}</div>`).join('')}</div></div>`;
    }

      <div class="section-h"><h2>${g.record === 'Ficha' ? 'Visitas' : 'Notas'}</h2><button data-a="newNote" data-id="${id}">+ Nueva nota</button></div>

  } else {
    body = sales.length ? `<div class="list">${sales.map(v => `<div class="row"><span class="grow"><span class="t1" style="display:block">${v.day === 0 ? 'Hoy' : fmtAgo(-v.day)}</span><span class="t2" style="display:block">${esc(v.lines.map(l => l.name).join(', '))} · ${v.payments.map(p => METHODS[p.method][0]).join(' + ')}</span></span><b class="tnum">${money(v.total)}</b></div>`).join('')}</div>` : `<div class="card empty">Sin pagos registrados.</div>`;
  }

  <div class="top" style="align-items:center"><button class="iconbtn" data-a="back" aria-label="Regresar">${ic('back', 22, 2)}</button>${syncHTML()}</div>
  ${offlineBar()}

function entryHTML(r, latest) {
  const open = S.openEntries[r.id] || false;
  const guide = latest ? ' data-guide="cliente"' : '';
  const when = r.ago === 0 ? 'Hoy' : fmtAgo(r.ago);
  return `<button class="entry ${latest ? 'latest' : ''}" data-a="toggleEntry" data-id="${r.id}" aria-expanded="${open}"${guide}>
    <span class="entry-h"><b>${esc(r.title)}</b><small style="white-space:nowrap">${when}</small></span>
    ${latest || r.private ? `<span class="chips">${latest ? '<span class="chip recent">Más reciente</span>' : ''}${r.private ? `<span class="chip neutral">${ic('lock', 14, 2)}Privada · solo tú la ves</span>` : ''}</span>` : ''}
    ${open ? `<dl>${r.body.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><small style="color:var(--text-2)">Por ${esc(r.author)}</small>` : `<span class="preview">${esc(r.body.map(b => b[1]).join(' '))}</span>`}
  </button>`;
}
function weightCard(ws) {
  const W = 300, H = 90, P = 18;
  const vals = ws.map(w => w[1]); const min = Math.min(...vals) - .5, max = Math.max(...vals) + .5;
  const pts = ws.map((w, i) => [P + i * (W - 2 * P) / (ws.length - 1), P + (max - w[1]) / (max - min) * (H - 2 * P)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts.at(-1);
  return `<div class="card plan"><div class="entry-h"><b>Peso</b><span class="chip ok">−${(vals[0] - vals.at(-1)).toFixed(1)} kg en 4 meses</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Peso de ${vals[0]} a ${vals.at(-1)} kilos">
    ${[0, 1, 2].map(i => `<line x1="${P}" x2="${W - P}" y1="${P + i * (H - 2 * P) / 2}" y2="${P + i * (H - 2 * P) / 2}" stroke="#e6e8f0" stroke-width="1"/>`).join('')}
    <path d="${path} L ${last[0]} ${H - P} L ${P} ${H - P} Z" fill="var(--accent-soft)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="var(--accent)" stroke="#fff" stroke-width="2"/>
    <text x="${last[0] - 6}" y="${last[1] - 9}" text-anchor="end" font-size="12" font-weight="700" fill="#003c70">${vals.at(-1)} kg</text>
    <text x="${P}" y="${pts[0][1] - 8}" font-size="11" fill="#626a80">${vals[0]} kg</text>
  </svg></div>`;
}

/* ---------- Vista pública ---------- */
function slotsFor(day, dur) {
  const busy = S.data.appts.filter(a => a.day === day && a.status !== 'cancelled').map(a => [a.start, a.start + svc(a.serviceId).dur]);
  const out = [];
  for (let t = 9 * 60; t + dur <= 20 * 60; t += 30) {
    const taken = busy.some(([s, e]) => t < e && t + dur > s);
    const past = day === 0 && t <= new Date().getHours() * 60 + new Date().getMinutes();
    out.push({ t, ok: !taken && !past });
  }
  return out;
}

function pubSticky() {
  const p = S.pub; if (!p) return '';

    const min = S.data.items.filter(i => i.type === 'service').reduce((a, i) => Math.min(a, i.price), Infinity);
    return `<div class="pub-sticky booking"><div class="price"><b class="tnum">Desde ${money(min)}</b><span>Reserva en línea, sin llamar</span></div><button class="btn btn-accent" data-a="pubStart">Reservar</button></div>`;
  }
  if (p.step === 'service') return `<div class="pub-sticky"><button class="btn btn-primary btn-block" data-a="pubNext" ${p.serviceId ? '' : 'disabled'}>Continuar</button></div>`;
  if (p.step === 'time') return `<div class="pub-sticky"><button class="btn btn-primary btn-block" data-a="pubNext" ${p.time != null ? '' : 'disabled'}>Continuar</button></div>`;
  if (p.step === 'data') {

    return `<div class="pub-sticky"><button class="btn btn-primary btn-block" id="pub-wa" data-a="pubWa" ${ok ? '' : 'disabled'}>${ic('chat', 20)}Confirmar por WhatsApp</button><p style="margin:8px 0 0;text-align:center;font-size:13px;color:var(--text-2)">Se abre WhatsApp con un mensaje listo. Solo tócale enviar.</p></div>`;
  }
  if (p.step === 'done') return `<div class="pub-sticky clear"><button class="btn btn-primary btn-block" data-a="pubRestart">Listo</button></div>`;
  return '';
}

  if (S.view === 'public' || !$('#cat')) return;
  const now = Date.now();
  const busy = cat.pop || S.sheet || $('#guide-root').innerHTML;
  if (cat.userSleep) cat.state = 'sleep';
  else if (busy) { if (cat.state !== 'sit') cat.state = 'sit'; cat.until = now + 2000; }
  else if (now - lastAct > 45000) cat.state = 'sleep';
  else if (cat.state === 'sleep') { cat.state = 'sit'; cat.until = now + 1200; }
  else if (cat.state === 'sit' && now > cat.until && !RM) {
    const w = appRect().width; cat.target = 12 + Math.random() * (w - 80); cat.dir = cat.target > cat.x ? 1 : -1; cat.state = 'walk';
  } else if (cat.state === 'walk') {
    cat.x += cat.dir * 4; cat.frame ^= 1;
    if ((cat.dir > 0 && cat.x >= cat.target) || (cat.dir < 0 && cat.x <= cat.target)) { cat.state = 'sit'; cat.until = now + 3500 + Math.random() * 6000; }
  }
  placeCat(false);
}
setInterval(catTick, 150);
function bindCatHover() {
  const el = $('#cat');
  el.addEventListener('mouseenter', () => { if (matchMedia('(hover:hover)').matches && !cat.pop) { clearTimeout(hoverTimer); hoverTimer = setTimeout(() => showCatMenu(true), 250); } });
  el.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); if (cat.pop && cat.pop.hover) hoverTimer = setTimeout(hideCatPop, 500); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCatMenu(); } });
}
function catMenuHTML() {

    <button data-a="catHelp">${ic('help', 20)}<span class="grow">¿Qué hago aquí?</span></button>
    <button data-a="catGuide">${ic('eye', 20)}<span class="grow">Muéstrame cómo</span></button>
    <button data-a="toast" data-msg="En la app real se abre WhatsApp con soporte de Catmin.">${ic('chat', 20)}<span class="grow">Hablar con soporte</span></button>

}
function showCatMenu(hover) { cat.pop = { type: 'menu', hover }; renderPop(catMenuHTML()); }
function toggleCatMenu() { if (cat.pop && cat.pop.type === 'menu') hideCatPop(); else showCatMenu(false); }
function catSay(title, text, actions, ms) {

function renderPop(html) {
  const root = $('#cat-pop-root'); if (!root) return;
  root.innerHTML = `<div class="cat-pop" id="cat-pop" role="dialog" aria-label="Ayuda del gato">${html}</div>`;
  const pop = $('#cat-pop');

function positionPop() {
  const pop = $('#cat-pop'), el = $('#cat'); if (!pop || !el) return;
  const ar = appRect(), w = ar.width, cb = parseFloat(el.style.bottom) || 0;
  let bottom = cb + 42;
  if (bottom + pop.offsetHeight > ar.height - 8) bottom = Math.max(8, cb - pop.offsetHeight - 6);

  pop.style.left = Math.max(8, Math.min(cat.x - 100, w - 258)) + 'px';
}
function hideCatPop() { cat.pop = null; clearTimeout(popTimer); const r = $('#cat-pop-root'); if (r) r.innerHTML = ''; }
function celebrate() {
  const el = $('#cat'); if (!el || RM) return;

/* ---------- guía ("Muéstrame cómo") ---------- */
function guideTarget() {
  const ctx = currentCtx();
  if (ctx === 'na') {
    const n = S.sheet; const g = G();
    const hasClient = n.clientId || (n.newMode && n.newName.trim().length > 2 && n.newPhone.replace(/\D/g, '').length === 10);
    if (!hasClient) return ['[data-step="client"]', n.newMode ? 'Escribe el nombre y su WhatsApp a 10 dígitos.' : `Primero elige a quién: escribe su nombre y tócalo en la lista.`];
    if (!n.serviceId) return ['[data-step="service"]', 'Ahora toca el servicio.'];
    if (n.time == null) return ['[data-step="time"]', 'Elige el día arriba y luego una hora libre. Las tachadas ya están ocupadas.'];
    return ['[data-step="save"]', 'Todo listo. Toca Agendar cita.'];
  }
  if (ctx === 'pay') {
    if (!S.sheet.pays.length) return ['[data-guide="pay"]', 'Toca la forma en que te pagaron. Si fueron dos, empieza por una.'];
    return ['.paylines', 'Escribe cuánto fue en cada forma de pago. Si hay dos, el resto se ajusta solo.'];
  }
  const h = helpFor();
  return h[2] ? [h[2], h[3]] : [null, h[1]];
}
function showGuide() {
  hideCatPop();
  const [sel, text] = guideTarget();
  const app = $('#app'); const target = sel ? app.querySelector(sel) : null;
  if (!target) { catSay('', text, null, 6000); return; }
  target.scrollIntoView({ block: 'center', behavior: 'auto' });
  requestAnimationFrame(() => {
    const ar = app.getBoundingClientRect(), r = target.getBoundingClientRect();
    const top = r.top - ar.top, below = top + r.height + 14 + 120 < ar.height;
    $('#guide-root').innerHTML = `<div class="guide" data-a="guideClose"><div class="ring" style="left:${r.left - ar.left - 6}px;top:${top - 6}px;width:${r.width + 12}px;height:${r.height + 12}px"></div><div class="guide-tip" style="${below ? `top:${top + r.height + 14}px` : `top:${Math.max(12, top - 130)}px`}"><div class="r"><span class="mini">${catSVG('sit', CATS[S.cat])}</span><span>${esc(text)}</span></div><button class="btn btn-primary btn-sm" style="align-self:flex-end">Entendido</button></div></div>`;
  });
}

/* ---------- acciones ---------- */
function addToCart(item, qty = 1) {
  if (!S.cart) S.cart = { clientId: null, apptId: null, lines: [] };
  const l = S.cart.lines.find(x => x.itemId === item.id);
  if (l) l.qty += qty; else S.cart.lines.push({ key: uid('l'), itemId: item.id, name: item.name, price: item.price, qty });
}
function syncPays(changedIdx) {
  const pays = S.sheet.pays, total = cartTotal();
  if (pays.length === 2 && changedIdx != null) {
    const other = changedIdx === 0 ? 1 : 0;
    pays[other].amount = Math.max(0, Math.round((total - (pays[changedIdx].amount || 0)) * 100) / 100);
    const inp = $('#pay-' + other); if (inp) inp.value = pays[other].amount || '';
  }
  pays.forEach((p, i) => { const c = $('#change-' + i); if (c) c.textContent = changeText(p); });
  const ps = $('#pay-state'); if (ps) ps.innerHTML = payStateHTML();
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  lastAct = Date.now();
  if (cat.userSleep === false && cat.state === 'sleep') { cat.state = 'sit'; cat.until = Date.now() + 1500; }
  const catEl = e.target.closest('#cat');
  if (catEl) { if (cat.userSleep) { A.catSleep(); return; } if (!(cat.pop && cat.pop.hover)) toggleCatMenu(); else cat.pop.hover = false; return; }
  const el = e.target.closest('[data-a]');
  if (!el) { if (cat.pop && !e.target.closest('#cat-pop')) hideCatPop(); return; }
  if (el.disabled) return;
  const a = el.dataset.a;
  if (cat.pop && !el.closest('#cat-pop') && a !== 'guideClose') hideCatPop();
  if (A[a]) A[a](el, e);
});
document.addEventListener('input', e => {
  lastAct = Date.now();
  const t = e.target;
  if (t.id === 'q-clients') {
    S.clientsQ = t.value; $('#client-list').innerHTML = clientListHTML();
    if (S.clientsQ.trim().length > 2 && !$('#client-list .row') && !S.flags.noResultTip) { S.flags.noResultTip = true; catSay('', `No encontré a nadie así. Revisa cómo se escribe o agrégalo como ${G().client} nuevo.`, null, 6000); }
  } else if (t.id === 'q-items') { S.cobrarQ = t.value; $('#items-grid').innerHTML = itemsGridHTML(); }
  else if (t.id === 'na-q') { S.sheet.q = t.value; $('#na-results').innerHTML = naResultsHTML(); }
  else if (t.id === 'na-new-name' || t.id === 'na-new-phone') {
    if (t.id === 'na-new-name') S.sheet.newName = t.value; else S.sheet.newPhone = t.value;
    const n = S.sheet; const ok = n.newName.trim().length > 2 && n.newPhone.replace(/\D/g, '').length === 10;
    $('.sheet-f').innerHTML = naFooter(ok, n.serviceId ? svc(n.serviceId) : null);
  } else if (t.dataset.pay != null) { const i = +t.dataset.pay; S.sheet.pays[i].amount = num(t.value); syncPays(i); }
  else if (t.dataset.rec != null) { const i = +t.dataset.rec; S.sheet.pays[i].received = t.value; syncPays(null); }
  else if (t.id === 'pub-name' || t.id === 'pub-phone') {
    if (t.id === 'pub-name') S.pub.name = t.value; else S.pub.phone = t.value;
    const st = document.querySelector('.pub-sticky'); if (st) st.outerHTML = pubSticky();

  }
});
document.addEventListener('focusout', e => {
  if (e.target.id === 'pub-phone') { S.pub.phoneTouched = true; const ok = S.pub.phone.replace(/\D/g, '').length === 10; e.target.classList.toggle('err', !ok); const m = $('#pub-phone-err'); if (m) m.hidden = ok; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#guide-root').innerHTML) A.guideClose(); else if (cat.pop) hideCatPop(); else if (S.sheet && !SHEETS[S.sheet.type]().noClose) A.sheetClose(); } });
window.addEventListener('resize', () => { renderPanel(); placeCat(true); });

/* ---------- inicio ---------- */
(function init() {
  const sg = store.get('giro'), sc = store.get('cat');
  if (sg && GIROS[sg]) S.giro = sg;
  if (sc && CATS[sc]) S.cat = sc;
  const h = (location.hash || '').replace('#', '');
  const [hg, hv] = h.split('-');
  if (GIROS[hg]) S.giro = hg;
  resetAll();
  if (hv === 'reserva') A.viewPublic();
  render();
  setTimeout(() => { if (S.view === 'app' && !S.sheet) catSay('¡Hola!', 'Soy tu gato de ayuda. Si te atoras, tócame.', null, 5000); }, 1800);
